<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Krishna</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 52% 40%, #160027 0%, #070012 32%, #010106 68%, #000 100%);
      font-family: Arial, sans-serif;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .scene {
      position: relative;
      z-index: 1;
      width: min(92vw, 600px);
      aspect-ratio: 3 / 4;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .aura {
      position: absolute;
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(32, 255, 255, 0.38) 0%,
          rgba(255, 0, 225, 0.25) 35%,
          rgba(121, 0, 255, 0.12) 54%,
          transparent 72%);
      filter: blur(22px);
      animation: pulse 3s ease-in-out infinite alternate;
    }

    .image-wrap {
      position: relative;
      width: min(82%, 450px);
      animation: float 4s ease-in-out infinite;
    }

    .image-wrap img {
      width: 100%;
      display: block;
      position: relative;
      z-index: 3;
      object-fit: contain;

      /* Make the image more intense */
      filter:
        brightness(1.25)
        contrast(1.5)
        saturate(2.2)
        hue-rotate(175deg)
        drop-shadow(0 0 3px #fff)
        drop-shadow(0 0 8px #00ffff)
        drop-shadow(0 0 18px #00d9ff)
        drop-shadow(0 0 32px #ff00d9)
        drop-shadow(0 0 55px #8a2bff);
    }

    /* Pink glow duplicate */
    .image-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: url("krishna.jpg") center / contain no-repeat;
      opacity: 0.78;
      mix-blend-mode: screen;
      filter:
        brightness(1.4)
        saturate(3)
        hue-rotate(270deg)
        blur(2px)
        drop-shadow(0 0 10px #ff00dd)
        drop-shadow(0 0 28px #ff00dd);
      animation: neonShift 5s linear infinite;
    }

    /* Cyan glow duplicate */
    .image-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: url("krishna.jpg") center / contain no-repeat;
      opacity: 0.65;
      mix-blend-mode: screen;
      filter:
        brightness(1.5)
        saturate(3)
        hue-rotate(160deg)
        blur(6px)
        drop-shadow(0 0 20px #00ffff)
        drop-shadow(0 0 42px #00bfff);
      animation: neonShift 6s linear infinite reverse;
    }

    .title {
      position: absolute;
      z-index: 5;
      bottom: 2%;
      width: 100%;
      text-align: center;
      color: #eaffff;
      letter-spacing: 0.22em;
      font-size: clamp(0.75rem, 2.2vw, 1rem);
      text-transform: uppercase;
      text-shadow:
        0 0 6px #00ffff,
        0 0 16px #ff00dd,
        0 0 30px #8a2bff;
      opacity: 0.85;
    }

    @keyframes float {
      from {
        transform: translateY(8px) scale(1);
      }
      to {
        transform: translateY(-8px) scale(1.015);
      }
    }

    @keyframes pulse {
      from {
        transform: scale(0.9);
        opacity: 0.55;
      }
      to {
        transform: scale(1.16);
        opacity: 1;
      }
    }

    @keyframes neonShift {
      0% {
        transform: translate(-2px, 0) scale(1);
      }
      50% {
        transform: translate(3px, -2px) scale(1.02);
      }
      100% {
        transform: translate(-2px, 0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .aura,
      .image-wrap,
      .image-wrap::before,
      .image-wrap::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <canvas id="particles"></canvas>

  <main class="scene">
    <div class="aura"></div>

    <div class="image-wrap">
      <img src="krishna.jpg" alt="Neon Krishna artwork" />
    </div>

    <p class="title">Divine Neon</p>
  </main>

  <script>
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createParticles();
    }

    function createParticles() {
      const count = Math.min(170, Math.floor(window.innerWidth / 7));

      particles = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2.6 + 0.4,
        speedX: (Math.random() - 0.5) * 0.35,
        speedY: (Math.random() - 0.5) * 0.35,
        alpha: Math.random() * 0.8 + 0.2,
        color: ["#00ffff", "#ff00dd", "#9a40ff", "#ffffff"][
          Math.floor(Math.random() * 4)
        ]
      }));
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;

        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;
        if (p.y < -10) p.y = canvas.height + 10;
        if (p.y > canvas.height + 10) p.y = -10;
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    drawParticles();
  </script>
</body>
  </html>
