<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Original stylized line-art illustration: Krishna silhouette, peacock feather, flute -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- divine aura rings behind the head -->
    <circle cx="330" cy="220" r="95" stroke-dasharray="2 10" stroke-width="2" opacity="0.5"/>
    <circle cx="330" cy="220" r="120" stroke-dasharray="2 14" stroke-width="2" opacity="0.3"/>

    <!-- head -->
    <path d="M283 175
             C283 138 305 112 335 112
             C368 112 390 140 388 176
             C387 198 378 214 366 226
             C358 234 348 238 335 238
             C317 238 300 228 291 210
             C285 200 283 188 283 175 Z"/>

    <!-- crown band -->
    <path d="M281 168 C300 150 366 150 389 170"/>
    <!-- peacock feather -->
    <path d="M330 150 C320 116 328 84 306 54 C324 60 340 76 344 98 C352 78 348 54 360 32"/>
    <ellipse cx="358" cy="26" rx="11" ry="17" transform="rotate(18 358 26)" stroke-width="2.5"/>
    <circle cx="358" cy="26" r="4" stroke-width="2"/>

    <!-- closed, serene eyes -->
    <path d="M305 190 C312 184 322 184 329 190" stroke-width="3"/>
    <path d="M342 190 C349 184 359 184 366 190" stroke-width="3"/>
    <!-- gentle smile -->
    <path d="M312 214 C322 222 348 222 358 214" stroke-width="3"/>
    <!-- tilak mark -->
    <path d="M335 158 L335 170" stroke-width="3"/>

    <!-- ear ornaments -->
    <path d="M283 196 C270 200 266 214 274 224" stroke-width="3"/>
    <path d="M388 196 C401 200 405 214 397 224" stroke-width="3"/>

    <!-- neck -->
    <path d="M315 236 L312 262 M356 236 L360 262"/>
    <!-- necklace -->
    <path d="M298 268 C315 282 356 282 373 268" stroke-width="3"/>

    <!-- torso, tribhanga (three-bend) pose -->
    <path d="M304 268
             C288 292 280 316 284 340
             C288 364 300 380 296 404
             C292 430 276 448 278 476"/>
    <path d="M366 268
             C384 292 392 314 388 336
             C384 360 370 378 372 402
             C374 428 388 448 384 474"/>

    <!-- raised left arm holding the flute up to the mouth -->
    <path d="M304 280 C280 282 258 276 240 260 C226 248 220 232 224 216"/>
    <path d="M312 296 C292 300 274 296 260 284 C250 274 246 262 250 250"/>
    <!-- hand fingers near mouth -->
    <path d="M224 216 C229 211 237 211 242 217"/>

    <!-- flute -->
    <path d="M168 236 L308 202" stroke-width="7"/>
    <circle cx="202" cy="228" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="226" cy="223" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="250" cy="217" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="274" cy="211" r="3" fill="#ffffff" stroke="none"/>

    <!-- lowered right arm resting toward the hip -->
    <path d="M366 288 C384 306 392 326 386 346 C381 364 368 376 366 392"/>
    <path d="M358 300 C372 316 378 332 373 348 C369 362 358 372 356 386"/>
    <path d="M356 386 C352 394 352 402 358 408"/>

    <!-- waist sash -->
    <path d="M282 344 C310 354 358 352 386 338" stroke-width="3"/>

    <!-- dhoti / lower garment, flared and flowing -->
    <path d="M278 476
             C260 500 252 528 262 554
             C268 570 280 580 280 598"/>
    <path d="M384 474
             C402 498 410 524 400 550
             C394 566 382 578 384 596"/>
    <path d="M280 598 C296 608 368 608 384 596" stroke-width="3"/>
    <path d="M270 408 C312 420 356 418 392 404" stroke-width="2.5" opacity="0.8"/>
    <path d="M266 444 C314 458 354 456 396 440" stroke-width="2.5" opacity="0.6"/>

    <!-- crossed feet, one knee bent (classic tribhanga stance) -->
    <path d="M280 598 C266 618 262 636 272 652" stroke-width="4"/>
    <path d="M384 596 C398 614 402 634 386 652" stroke-width="4"/>
    <path d="M254 652 L296 656" stroke-width="5"/>
    <path d="M370 652 L410 648" stroke-width="5"/>

    <!-- anklets -->
    <circle cx="272" cy="652" r="5" stroke-width="2"/>
    <circle cx="386" cy="652" r="5" stroke-width="2"/>
  </g>
</svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
