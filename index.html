<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Image Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #1c0534 0%, #090015 38%, #000000 78%);
    }

    #particleCanvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 35px 0 55px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: 0.04em;
      text-shadow:
        0 0 8px #00ffff,
        0 0 22px #ff00dd,
        0 0 45px #8a2bff;
    }

    .subtitle {
      max-width: 700px;
      margin: 15px auto 30px;
      color: #d8cde7;
      text-align: center;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .upload-label,
    button {
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 13px 18px;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .upload-label {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #00b7ff, #7d2cff);
      box-shadow: 0 0 20px rgba(0, 195, 255, 0.38);
    }

    button {
      background: linear-gradient(135deg, #ff00b8, #7e26ff);
      box-shadow: 0 0 20px rgba(255, 0, 184, 0.35);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
      box-shadow: none;
    }

    .upload-label:hover,
    button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 18px #00ffff,
        0 0 34px #ff00dd;
    }

    #imageInput {
      display: none;
    }

    .status {
      min-height: 25px;
      margin: 0 0 20px;
      color: #b9f9ff;
      text-align: center;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid rgba(79, 226, 255, 0.3);
      border-radius: 18px;
      background: rgba(8, 4, 20, 0.7);
      box-shadow:
        inset 0 0 35px rgba(93, 0, 255, 0.12),
        0 0 28px rgba(0, 229, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .panel h2 {
      margin: 0;
      padding: 15px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
    }

    .preview-box {
      min-height: 420px;
      display: grid;
      place-items: center;
      padding: 15px;
      background:
        radial-gradient(circle at center, #15102a 0%, #05050b 75%);
    }

    #originalPreview,
    #neonCanvas {
      display: none;
      max-width: 100%;
      max-height: 580px;
      border-radius: 10px;
    }

    #originalPreview {
      object-fit: contain;
    }

    #neonCanvas {
      background: #000000;
      box-shadow:
        0 0 12px #00ffff,
        0 0 25px #ff00cc,
        0 0 55px #7a22ff;
      animation: glowPulse 2.5s ease-in-out infinite alternate;
    }

    .placeholder {
      padding: 30px;
      color: #b3a8c9;
      text-align: center;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, minmax(130px, 1fr));
      gap: 15px;
      margin: 25px auto;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(8, 4, 20, 0.7);
    }

    .setting label {
      display: block;
      margin-bottom: 9px;
      color: #ded4e9;
      font-size: 0.9rem;
    }

    .setting input {
      width: 100%;
      accent-color: #00ffff;
    }

    .value {
      color: #00ffff;
      font-weight: bold;
    }

    .download-row {
      display: flex;
      justify-content: center;
      margin-top: 5px;
    }

    @keyframes glowPulse {
      from {
        filter: brightness(1);
      }

      to {
        filter: brightness(1.15);
      }
    }

    @media (max-width: 760px) {
      .panels {
        grid-template-columns: 1fr;
      }

      .preview-box {
        min-height: 300px;
      }

      .settings {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <canvas id="particleCanvas"></canvas>

  <main class="container">
    <h1>Neon Image Converter</h1>

    <p class="subtitle">
      Upload your image, then create a colorful neon glow effect directly in your browser.
    </p>

    <section class="controls">
      <label class="upload-label" for="imageInput">
        1. Upload Image
      </label>

      <input id="imageInput" type="file" accept="image/*" />

      <button id="createButton" disabled>
        2. Create Neon Effect
      </button>

      <button id="downloadButton" disabled>
        3. Download PNG
      </button>
    </section>

    <p id="status" class="status">Choose an image to begin.</p>

    <section class="settings">
      <div class="setting">
        <label for="glowRange">
          Glow Strength: <span id="glowValue" class="value">20</span>
        </label>
        <input id="glowRange" type="range" min="0" max="45" value="20" />
      </div>

      <div class="setting">
        <label for="contrastRange">
          Contrast: <span id="contrastValue" class="value">1.5</span>
        </label>
        <input id="contrastRange" type="range" min="0.7" max="2.5" step="0.1" value="1.5" />
      </div>

      <div class="setting">
        <label for="colorRange">
          Color Shift: <span id="colorValue" class="value">190°</span>
        </label>
        <input id="colorRange" type="range" min="0" max="360" value="190" />
      </div>
    </section>

    <section class="panels">
      <article class="panel">
        <h2>Original Image</h2>

        <div class="preview-box">
          <p id="originalPlaceholder" class="placeholder">
            Your uploaded image will appear here.
          </p>

          <img id="originalPreview" alt="Original uploaded preview" />
        </div>
      </article>

      <article class="panel">
        <h2>Neon Result</h2>

        <div class="preview-box">
          <p id="neonPlaceholder" class="placeholder">
            The colorful neon result will appear here after you click “Create Neon Effect”.
          </p>

          <canvas id="neonCanvas"></canvas>
        </div>
      </article>
    </section>
  </main>

  <script>
    const imageInput = document.getElementById("imageInput");
    const originalPreview = document.getElementById("originalPreview");
    const originalPlaceholder = document.getElementById("originalPlaceholder");

    const createButton = document.getElementById("createButton");
    const downloadButton = document.getElementById("downloadButton");
    const status = document.getElementById("status");

    const neonCanvas = document.getElementById("neonCanvas");
    const neonContext = neonCanvas.getContext("2d");

    const neonPlaceholder = document.getElementById("neonPlaceholder");

    const glowRange = document.getElementById("glowRange");
    const contrastRange = document.getElementById("contrastRange");
    const colorRange = document.getElementById("colorRange");

    const glowValue = document.getElementById("glowValue");
    const contrastValue = document.getElementById("contrastValue");
    const colorValue = document.getElementById("colorValue");

    let uploadedImage = new Image();
    let imageWasUploaded = false;

    imageInput.addEventListener("change", function (event) {
      const selectedFile = event.target.files[0];

      if (!selectedFile) {
        return;
      }

      if (!selectedFile.type.startsWith("image/")) {
        status.textContent = "Please choose a valid image file.";
        return;
      }

      const reader = new FileReader();

      reader.onload = function (loadEvent) {
        originalPreview.src = loadEvent.target.result;

        uploadedImage.onload = function () {
          imageWasUploaded = true;
          createButton.disabled = false;
          downloadButton.disabled = true;

          originalPreview.style.display = "block";
          originalPlaceholder.classList.add("hidden");

          neonCanvas.style.display = "none";
          neonPlaceholder.classList.remove("hidden");

          status.textContent = "Image uploaded. Now click “Create Neon Effect”.";
        };

        uploadedImage.src = loadEvent.target.result;
      };

      reader.readAsDataURL(selectedFile);
    });

    createButton.addEventListener("click", function () {
      createNeonImage();
      downloadButton.disabled = false;
      status.textContent = "Neon effect created. Adjust the sliders or download your PNG.";
    });

    glowRange.addEventListener("input", updateControls);
    contrastRange.addEventListener("input", updateControls);
    colorRange.addEventListener("input", updateControls);

    function updateControls() {
      glowValue.textContent = glowRange.value;
      contrastValue.textContent = contrastRange.value;
      colorValue.textContent = colorRange.value + "°";

      if (imageWasUploaded) {
        createNeonImage();
        downloadButton.disabled = false;
      }
    }

    function createNeonImage() {
      if (!imageWasUploaded) {
        return;
      }

      const maximumSize = 1000;
      const scale = Math.min(
        1,
        maximumSize / uploadedImage.naturalWidth,
        maximumSize / uploadedImage.naturalHeight
      );

      const width = Math.round(uploadedImage.naturalWidth * scale);
      const height = Math.round(uploadedImage.naturalHeight * scale);

      neonCanvas.width = width;
      neonCanvas.height = height;

      const glow = Number(glowRange.value);
      const contrast = Number(contrastRange.value);
      const hue = Number(colorRange.value);

      neonContext.clearRect(0, 0, width, height);

      // Step 1: dark background
      neonContext.fillStyle = "#020208";
      neonContext.fillRect(0, 0, width, height);

      // Step 2: draw a blurred colorful glow behind the image
      neonContext.save();
      neonContext.globalCompositeOperation = "screen";
      neonContext.filter =
        `brightness(1.8) saturate(3) contrast(${contrast}) ` +
        `hue-rotate(${hue}deg) blur(${Math.max(4, glow / 2)}px)`;

      neonContext.globalAlpha = 0.82;
      neonContext.drawImage(uploadedImage, 0, 0, width, height);
      neonContext.restore();

      // Step 3: cyan glowing image layer
      neonContext.save();
      neonContext.globalCompositeOperation = "screen";
      neonContext.filter =
        `brightness(1.35) saturate(2.8) contrast(${contrast}) ` +
        `hue-rotate(${hue}deg)`;

      neonContext.shadowColor = "#00ffff";
      neonContext.shadowBlur = glow;
      neonContext.drawImage(uploadedImage, 0, 0, width, height);
      neonContext.restore();

      // Step 4: magenta colored layer
      neonContext.save();
      neonContext.globalCompositeOperation = "screen";
      neonContext.filter =
        `brightness(1.25) saturate(3) contrast(${contrast}) ` +
        `hue-rotate(${(hue + 95) % 360}deg)`;

      neonContext.globalAlpha = 0.52;
      neonContext.shadowColor = "#ff00d9";
      neonContext.shadowBlur = glow * 1.3;
      neonContext.drawImage(uploadedImage, 0, 0, width, height);
      neonContext.restore();

      // Step 5: bright original-like highlight layer
      neonContext.save();
      neonContext.globalCompositeOperation = "screen";
      neonContext.filter = `brightness(1.6) contrast(${contrast + 0.2}) saturate(2.4)`;

      neonContext.globalAlpha = 0.52;
      neonContext.shadowColor = "#8d3dff";
      neonContext.shadowBlur = glow * 0.7;
      neonContext.drawImage(uploadedImage, 0, 0, width, height);
      neonContext.restore();

      // Step 6: add small neon sparkles
      addSparkles(width, height, 115);

      neonCanvas.style.display = "block";
      neonPlaceholder.classList.add("hidden");
    }

    function addSparkles(width, height, count) {
      const colors = ["#00ffff", "#ff00d9", "#ae57ff", "#ffffff"];

      neonContext.save();
      neonContext.globalCompositeOperation = "screen";

      for (let i = 0; i < count; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const radius = Math.random() * 2.2 + 0.4;
        const color = colors[Math.floor(Math.random() * colors.length)];

        neonContext.beginPath();
        neonContext.arc(x, y, radius, 0, Math.PI * 2);

        neonContext.fillStyle = color;
        neonContext.shadowColor = color;
        neonContext.shadowBlur = 10;
        neonContext.globalAlpha = Math.random() * 0.75 + 0.25;
        neonContext.fill();
      }

      neonContext.restore();
    }

    downloadButton.addEventListener("click", function () {
      const link = document.createElement("a");
      link.download = "my-neon-image.png";
      link.href = neonCanvas.toDataURL("image/png");
      link.click();
    });

    // Background animated particles
    const particleCanvas = document.getElementById("particleCanvas");
    const particleContext = particleCanvas.getContext("2d");

    let particles = [];

    function resizeParticleCanvas() {
      particleCanvas.width = window.innerWidth;
      particleCanvas.height = window.innerHeight;
      createParticles();
    }

    function createParticles() {
      const total = Math.min(150, Math.floor(window.innerWidth / 8));

      particles = Array.from({ length: total }, function () {
        return {
          x: Math.random() * particleCanvas.width,
          y: Math.random() * particleCanvas.height,
          radius: Math.random() * 2 + 0.4,
          speedX: (Math.random() - 0.5) * 0.25,
          speedY: (Math.random() - 0.5) * 0.25,
          opacity: Math.random() * 0.65 + 0.2,
          color: ["#00ffff", "#ff00dd", "#9f4cff", "#ffffff"][
            Math.floor(Math.random() * 4)
          ]
        };
      });
    }

    function animateParticles() {
      particleContext.clearRect(
        0,
        0,
        particleCanvas.width,
        particleCanvas.height
      );

      for (const particle of particles) {
        particleContext.beginPath();
        particleContext.arc(
          particle.x,
          particle.y,
          particle.radius,
          0,
          Math.PI * 2
        );

        particleContext.globalAlpha = particle.opacity;
        particleContext.fillStyle = particle.color;
        particleContext.shadowColor = particle.color;
        particleContext.shadowBlur = 12;
        particleContext.fill();

        particle.x += particle.speedX;
        particle.y += particle.speedY;

        if (particle.x < -5) particle.x = particleCanvas.width + 5;
        if (particle.x > particleCanvas.width + 5) particle.x = -5;
        if (particle.y < -5) particle.y = particleCanvas.height + 5;
        if (particle.y > particleCanvas.height + 5) particle.y = -5;
      }

      particleContext.globalAlpha = 1;
      particleContext.shadowBlur = 0;

      requestAnimationFrame(animateParticles);
    }

    window.addEventListener("resize", resizeParticleCanvas);

    resizeParticleCanvas();
    animateParticles();
  </script>
</body>
</html>
