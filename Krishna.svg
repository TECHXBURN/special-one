<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" style="background-color: #030308;">
  <defs>
    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Curved Text Path for Heading -->
    <path id="text-arc-1" d="M 100,200 Q 400,100 700,200" />
    <path id="text-arc-2" d="M 60,280 Q 400,170 740,280" />
  </defs>

  <!-- BACKGROUND GLOWS -->
  <circle cx="400" cy="720" r="300" fill="#d946ef" opacity="0.12" filter="url(#glow-magenta)"/>
  <circle cx="400" cy="720" r="200" fill="#06b6d4" opacity="0.15" filter="url(#glow-cyan)"/>

  <!-- TOP TEXT SECTION -->
  <g font-family="'Georgia', 'Times New Roman', serif" font-weight="bold" fill="#facc15" filter="url(#glow-gold)">
    <text font-size="42" letter-spacing="1">
      <textPath href="#text-arc-1" startOffset="50%" text-anchor="middle">
        POV: How developers
      </textPath>
    </text>
    <text font-size="50" letter-spacing="1.5">
      <textPath href="#text-arc-2" startOffset="50%" text-anchor="middle">
        celebrate Krishnashtami
      </textPath>
    </text>
  </g>

  <!-- ICONS UNDER TEXT -->
  <g transform="translate(350, 260)">
    <!-- Peacock Feather Icon -->
    <g filter="url(#glow-cyan)">
      <path d="M -25,0 C -25,-20 -10,-30 0,-30 C 10,-30 25,-20 25,0 C 25,15 10,25 0,25 C -10,25 -25,15 -25,0 Z" fill="none" stroke="#10b981" stroke-width="2"/>
      <circle cx="0" cy="-5" r="10" fill="#0284c7"/>
      <circle cx="0" cy="-5" r="5" fill="#38bdf8"/>
      <path d="M 0,25 Q -5,45 -15,55 M 0,25 Q 5,45 15,55" stroke="#10b981" stroke-width="2" fill="none"/>
    </g>
    <!-- Flute Icon -->
    <g transform="translate(60, 10) rotate(-25)" filter="url(#glow-gold)">
      <rect x="-10" y="-6" width="90" height="12" rx="4" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="10" cy="0" r="2" fill="#451a03"/>
      <circle cx="25" cy="0" r="2" fill="#451a03"/>
      <circle cx="40" cy="0" r="2" fill="#451a03"/>
      <circle cx="55" cy="0" r="2" fill="#451a03"/>
      <!-- Red Tassels -->
      <path d="M 75,4 L 85,15 M 75,0 L 88,10" stroke="#ef4444" stroke-width="2"/>
    </g>
  </g>

  <!-- NEON ILLUSTRATION GROUP -->
  <g transform="translate(0, 80)">

    <!-- SPARKLES / PARTICLES MATRIX -->
    <g id="particle-cloud">
      <!-- Cyan Particles -->
      <g fill="#38bdf8" filter="url(#glow-cyan)">
        <circle cx="280" cy="520" r="2"/><circle cx="310" cy="490" r="3"/><circle cx="340" cy="460" r="1.5"/>
        <circle cx="260" cy="580" r="2.5"/><circle cx="290" cy="550" r="3.5"/><circle cx="320" cy="530" r="2"/>
        <circle cx="300" cy="620" r="1.5"/><circle cx="330" cy="600" r="3"/><circle cx="350" cy="570" r="2"/>
        <circle cx="480" cy="480" r="2"/><circle cx="510" cy="510" r="3"/><circle cx="530" cy="470" r="1.5"/>
        <circle cx="460" cy="550" r="2.5"/><circle cx="490" cy="580" r="3.5"/><circle cx="520" cy="540" r="2"/>
        <circle cx="450" cy="630" r="1.5"/><circle cx="480" cy="660" r="3"/><circle cx="510" cy="610" r="2"/>
      </g>
      <!-- Magenta / Pink Particles -->
      <g fill="#f43f5e" filter="url(#glow-magenta)">
        <circle cx="290" cy="500" r="3"/><circle cx="320" cy="470" r="2"/><circle cx="350" cy="500" r="3.5"/>
        <circle cx="270" cy="560" r="1.5"/><circle cx="300" cy="530" r="2.5"/><circle cx="330" cy="560" r="1.8"/>
        <circle cx="280" cy="640" r="3"/><circle cx="310" cy="590" r="2"/><circle cx="340" cy="630" r="2.5"/>
        <circle cx="470" cy="500" r="2.5"/><circle cx="500" cy="480" r="3.5"/><circle cx="540" cy="520" r="2"/>
        <circle cx="480" cy="570" r="1.8"/><circle cx="510" cy="550" r="3"/><circle cx="530" cy="590" r="2.5"/>
        <circle cx="460" cy="640" r="2"/><circle cx="490" cy="620" r="3.5"/><circle cx="520" cy="650" r="1.5"/>
      </g>
      <!-- Gold / Yellow Dots -->
      <g fill="#fde047" filter="url(#glow-gold)">
        <circle cx="305" cy="510" r="2"/><circle cx="335" cy="485" r="2.5"/>
        <circle cx="285" cy="575" r="1.5"/><circle cx="315" cy="545" r="2"/>
        <circle cx="495" cy="495" r="2"/><circle cx="525" cy="530" r="1.5"/>
        <circle cx="475" cy="585" r="2.5"/><circle cx="505" cy="565" r="2"/>
      </g>
    </g>

    <!-- BABY KRISHNA (NEON CONTOURS) -->
    <g id="baby-krishna">
      <!-- Peacock Feather on Head -->
      <g filter="url(#glow-cyan)">
        <path d="M 520,380 C 530,340 560,330 570,350 C 575,370 540,390 520,380 Z" stroke="#00f0ff" stroke-width="3" fill="none"/>
        <path d="M 535,365 C 540,350 555,350 555,362 C 555,370 540,375 535,365 Z" stroke="#d946ef" stroke-width="2" fill="#00f0ff" opacity="0.8"/>
        <path d="M 520,380 Q 510,400 500,410" stroke="#00f0ff" stroke-width="2.5" fill="none"/>
      </g>

      <!-- Hair Curly Outline -->
      <g stroke="#d946ef" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)">
        <path d="M 430,420 C 420,390 450,370 470,385 C 480,370 510,375 520,395 C 540,380 565,400 555,425 C 570,440 560,470 540,475"/>
        <path d="M 430,420 C 410,435 415,460 430,470"/>
        <!-- Top Bun / Sikha -->
        <path d="M 480,380 C 470,360 490,345 505,355 C 520,345 535,365 520,380"/>
      </g>

      <!-- Face Outline -->
      <path d="M 430,465 C 425,505 455,530 490,530 C 530,530 550,495 545,460" stroke="#00f0ff" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow-cyan)"/>

      <!-- Tilak on Forehead -->
      <g filter="url(#glow-gold)">
        <path d="M 483,415 L 483,440 Q 490,450 497,440 L 497,415 Z" stroke="#facc15" stroke-width="2.5" fill="none"/>
        <circle cx="490" cy="445" r="2.5" fill="#ef4444"/>
      </g>

      <!-- Eyebrows -->
      <g stroke="#00f0ff" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow-cyan)">
        <path d="M 445,445 Q 460,438 472,446"/>
        <path d="M 508,446 Q 520,438 535,445"/>
      </g>

      <!-- Large Cute Expressive Eyes -->
      <!-- Left Eye -->
      <g filter="url(#glow-cyan)">
        <ellipse cx="460" cy="465" rx="14" ry="18" stroke="#00f0ff" stroke-width="3.5" fill="#030308"/>
        <ellipse cx="462" cy="465" rx="7" ry="10" fill="#00f0ff"/>
        <circle cx="457" cy="458" r="4" fill="#ffffff"/>
        <circle cx="465" cy="470" r="2" fill="#ffffff"/>
      </g>
      <!-- Right Eye -->
      <g filter="url(#glow-cyan)">
        <ellipse cx="520" cy="465" rx="14" ry="18" stroke="#00f0ff" stroke-width="3.5" fill="#030308"/>
        <ellipse cx="518" cy="465" rx="7" ry="10" fill="#00f0ff"/>
        <circle cx="513" cy="458" r="4" fill="#ffffff"/>
        <circle cx="521" cy="470" r="2" fill="#ffffff"/>
      </g>

      <!-- Nose & Smile -->
      <path d="M 488,470 Q 490,478 493,472" stroke="#d946ef" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)"/>
      <path d="M 478,492 Q 490,504 502,492" stroke="#d946ef" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)"/>

      <!-- Chubby Cheeks / Blush -->
      <ellipse cx="442" cy="485" rx="8" ry="5" fill="#d946ef" opacity="0.6" filter="url(#glow-magenta)"/>
      <ellipse cx="538" cy="485" rx="8" ry="5" fill="#d946ef" opacity="0.6" filter="url(#glow-magenta)"/>

      <!-- Small Baby Body & Arms resting on Hand -->
      <g stroke="#d946ef" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)">
        <!-- Shoulders / Arms -->
        <path d="M 440,515 C 420,530 425,560 450,565 C 470,570 490,555 490,530"/>
        <path d="M 540,510 C 555,530 550,555 530,565 C 510,570 490,555 490,530"/>
        <!-- Pearl Necklace -->
        <path d="M 465,530 Q 490,545 515,530" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="2 6" filter="url(#glow-cyan)"/>
      </g>
    </g>

    <!-- SUPPORTING HUMAN HAND (NEON OUTLINE) -->
    <!-- Hand cradling / lifting Baby Krishna -->
    <g id="supporting-hand">
      <!-- Main Palm and Forearm -->
      <path d="M 180,820 
               C 220,760 270,710 320,650 
               C 340,626 380,560 430,535
               C 460,520 480,530 460,555
               C 430,590 380,640 340,680
               C 300,720 250,790 220,850" 
            stroke="#00f0ff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)"/>

      <!-- Index Finger extended under Krishna -->
      <path d="M 320,650 
               C 360,590 410,520 455,485 
               C 475,470 495,485 470,510 
               C 430,550 370,620 330,670" 
            stroke="#00f0ff" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow-cyan)"/>

      <!-- Middle & Ring Fingers Curved -->
      <path d="M 300,675 C 330,640 370,600 400,590 C 415,585 420,600 400,615 C 370,638 320,690 290,710" 
            stroke="#00f0ff" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-cyan)"/>

      <!-- Thumb Outline -->
      <path d="M 260,705 C 240,660 255,620 280,610 C 295,605 305,620 290,640 C 275,660 270,680 275,710" 
            stroke="#00f0ff" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-cyan)"/>

      <!-- Glowing Wrist Ornament / Bracelet (Kada) -->
      <g filter="url(#glow-magenta)">
        <path d="M 200,810 C 220,790 250,815 230,845 C 210,865 185,835 200,810 Z" stroke="#d946ef" stroke-width="3.5" fill="none"/>
        <path d="M 185,825 C 205,805 235,830 215,860" stroke="#f43f5e" stroke-width="2" fill="none"/>
        <!-- Mandalas / Patterns on Wrist -->
        <circle cx="215" cy="828" r="6" stroke="#d946ef" stroke-width="2" fill="none"/>
        <path d="M 215,818 L 215,838 M 205,828 L 225,828" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
      </g>
    </g>

    <!-- EXTRA NEON RAYS & MAGICAL DUST -->
    <g id="magic-beams" stroke="#ffffff" opacity="0.7" filter="url(#glow-cyan)">
      <line x1="450" y1="500" x2="430" y2="480" stroke-width="2" stroke-linecap="round"/>
      <line x1="470" y1="475" x2="465" y2="450" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="430" y1="530" x2="400" y2="520" stroke-width="2" stroke-linecap="round"/>
      <line x1="500" y1="525" x2="520" y2="545" stroke-width="2" stroke-linecap="round"/>
    </g>

  </g>
</svg>
